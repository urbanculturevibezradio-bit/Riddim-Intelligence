<!DOCTYPE html>
<html>
<head><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1280px; height: 720px; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
.bg {
  width: 100%; height: 100%;
  background: linear-gradient(135deg, #0d2010 0%, #1a3d1a 40%, #0a1a2d 100%);
  display: flex; position: relative;
}
.left { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 60px 50px 60px 70px; z-index: 2; }
.right { width: 480px; background: linear-gradient(180deg, #2ea043 0%, #1a6b2a 100%); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
.right::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 30% 40%, rgba(255,255,255,0.06) 0%, transparent 60%); }
.show-tag { color: #2ea043; font-size: 14px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 16px; }
.ep-title { color: #ffffff; font-size: 46px; font-weight: 800; line-height: 1.1; margin-bottom: 20px; }
.ep-sub { color: #88aa88; font-size: 22px; font-weight: 400; line-height: 1.4; }
.brand { position: absolute; bottom: 40px; left: 70px; color: #446644; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; }
.right-icon { font-size: 100px; filter: drop-shadow(0 4px 20px rgba(0,0,0,0.3)); }
.right-label { position: absolute; bottom: 30px; color: rgba(0,0,0,0.4); font-size: 12px; letter-spacing: 3px; font-weight: 700; text-transform: uppercase; }
.accent-bar { position: absolute; top: 0; left: 0; width: 6px; height: 100%; background: #2ea043; }
</style></head>
<body>
<div class="bg">
  <div class="accent-bar"></div>
  <div class="left">
    <div class="show-tag">Culture Talk</div>
    <div class="ep-title">Caribbean People:<br>History & Identity</div>
    <div class="ep-sub">Conversations on Caribbean identity, music history, and the diaspora experience.</div>
    <div class="brand">Urban Culture Vibez Radio</div>
  </div>
  <div class="right">
    <div class="right-icon">🎙️</div>
    <div class="right-label">PODCAST</div>
  </div>
</div>
</body>
</html>
