<!DOCTYPE html>
<html>
<head><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1280px; height: 720px; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
.bg {
  width: 100%; height: 100%;
  background: linear-gradient(135deg, #1a0a0a 0%, #2d1111 40%, #0d1f0d 100%);
  display: flex; position: relative;
}
.left { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 60px 50px 60px 70px; z-index: 2; }
.right { width: 480px; background: linear-gradient(180deg, #d43535 0%, #8b1a1a 100%); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
.right::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at center, rgba(255,255,255,0.08) 0%, transparent 70%); }
.show-tag { color: #d43535; font-size: 14px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 16px; }
.ep-title { color: #ffffff; font-size: 48px; font-weight: 800; line-height: 1.1; margin-bottom: 20px; }
.ep-sub { color: #aa8888; font-size: 22px; font-weight: 400; line-height: 1.4; }
.brand { position: absolute; bottom: 40px; left: 70px; color: #664444; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; }
.right-icon { font-size: 100px; filter: drop-shadow(0 4px 20px rgba(0,0,0,0.3)); }
.right-label { position: absolute; bottom: 30px; color: rgba(0,0,0,0.4); font-size: 12px; letter-spacing: 3px; font-weight: 700; text-transform: uppercase; }
.accent-bar { position: absolute; top: 0; left: 0; width: 6px; height: 100%; background: #d43535; }
</style></head>
<body>
<div class="bg">
  <div class="accent-bar"></div>
  <div class="left">
    <div class="show-tag">Riddim Roots</div>
    <div class="ep-title">Reggae: The Story<br>of Jamaican Music</div>
    <div class="ep-sub">Tracing the origins of iconic riddims and the producers who shaped Caribbean music.</div>
    <div class="brand">Urban Culture Vibez Radio</div>
  </div>
  <div class="right">
    <div class="right-icon">🎵</div>
    <div class="right-label">PODCAST</div>
  </div>
</div>
</body>
</html>
