<!DOCTYPE html>
<html>
<head><style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { width: 1280px; height: 720px; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif; }
.bg {
  width: 100%; height: 100%;
  background: linear-gradient(135deg, #0a1628 0%, #1a2744 40%, #2d1b3d 100%);
  display: flex; position: relative;
}
.left { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 60px 50px 60px 70px; z-index: 2; }
.right { width: 480px; background: linear-gradient(180deg, #e8a838 0%, #c47f1e 100%); display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
.right::before { content: ''; position: absolute; inset: 0; background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.03) 10px, rgba(255,255,255,0.03) 20px); }
.show-tag { color: #e8a838; font-size: 14px; font-weight: 700; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 16px; }
.ep-title { color: #ffffff; font-size: 48px; font-weight: 800; line-height: 1.1; margin-bottom: 20px; }
.ep-sub { color: #8899bb; font-size: 22px; font-weight: 400; line-height: 1.4; }
.brand { position: absolute; bottom: 40px; left: 70px; color: #556688; font-size: 13px; letter-spacing: 3px; text-transform: uppercase; }
.right-icon { font-size: 120px; filter: drop-shadow(0 4px 20px rgba(0,0,0,0.3)); }
.right-label { position: absolute; bottom: 30px; color: rgba(0,0,0,0.4); font-size: 12px; letter-spacing: 3px; font-weight: 700; text-transform: uppercase; }
.accent-bar { position: absolute; top: 0; left: 0; width: 6px; height: 100%; background: #e8a838; }
</style></head>
<body>
<div class="bg">
  <div class="accent-bar"></div>
  <div class="left">
    <div class="show-tag">Diaspora Diaries</div>
    <div class="ep-title">Neither Here<br>Nor There</div>
    <div class="ep-sub">Personal stories from Caribbean people around the world — their journeys, struggles, and triumphs.</div>
    <div class="brand">Urban Culture Vibez Radio</div>
  </div>
  <div class="right">
    <div class="right-icon">🌍</div>
    <div class="right-label">PODCAST</div>
  </div>
</div>
</body>
</html>
